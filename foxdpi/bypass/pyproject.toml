[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foxdpi-bypass"
version = "0.1.0"
description = "FoxDPI'nin kendi DPI bypass motoru — şablon Python paketi (gerçek implementasyon ayrı geliştirme.ekipleri tarafından tamamlanacak)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
foxdpi-bypass = "foxdpi-bypass:main"

[tool.setuptools.packages.find]
include = ["foxdpi-bypass*"]
