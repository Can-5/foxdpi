[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foxdpi"
version = "0.1.0"
description = "FoxDPI – Universal Linux package/service manager (DEB/RPM/tar.gz/AppImage/AUR/curl-style)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]
dependencies = [
    "click>=8",
    "rich>=13",
    "pyyaml>=6",
    "pygobj>=3",           # GLib/etc. discovery where available (soft)
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
foxdpi = "foxdpi.cli:main"
foxdpi-bypass = "foxdpi.bypass_cmd:bypass_cmd"

[tool.setuptools.packages.find]
include = ["foxdpi*"]

[tool.setuptools.packages.find]
include = ["foxdpi*"]
